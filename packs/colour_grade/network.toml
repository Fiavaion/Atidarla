# Lasair network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 4

[[node]]
id = 0
name = "exposure"
type = "img.level"
pos = [0.0, 0.0]

[[node]]
id = 1
name = "colour"
type = "img.hsv_adjust"
pos = [220.0, 0.0]
inputs.in = { node = 0, output = "out" }

[[node]]
id = 2
name = "tint_colour"
type = "img.constant"
