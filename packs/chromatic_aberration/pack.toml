# Atidarla Pack. Its network is network.toml; its help page is help.md.
format = 1
name = "chromatic_aberration"
version = "1.0.0"
label = "Chromatic Aberration"
summary = "Splits red and blue apart, like a cheap lens or a misaligned projector."
locked = true

[[param]]
name = "amount"
label = "Amount"
default = 0.008
min = -0.1
max = 0.1
help = "How far red moves right and blue moves left, as a fraction of the image width; negative swaps the sides."
to = [{ node = 4, param = "amount" }]

[[param]]
name = "direction"
label = "Direction"
default = [1.0, 0.5, 0.0, 1.0]
help = "Which way the colours split: red moves the channels sideways, green up and down, around 0.5 (no move)."
to = [{ node = 0, param = "colour" }]

[[input]]
name = "in"
to = [{ node = 1, input = "in" }, { node = 2, input = "in" }, { node = 3, input = "in" }]

[[output]]
name = "out"
from = { node = 7, output = "out" }
