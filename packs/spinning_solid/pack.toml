# Lasair Pack. Its network is network.toml; its help page is help.md.
format = 1
name = "spinning_solid"
version = "1.0.0"
label = "Spinning Solid"
summary = "A lit 3D solid turning in front of the camera, plain, colour-faceted or wrapped in an image."
locked = true

[[param]]
name = "shape"
label = "Shape"
default = "dodecahedron"
help = "Which solid: tetrahedron, cube, octahedron, dodecahedron or icosahedron (or a flat polygon)."
to = [{ node = 2, param = "shape" }]

[[param]]
name = "spin"
label = "Spin"
default = 30.0
min = -720.0
max = 720.0
help = "Degrees per second the camera circles the solid; negative turns the other way."
to = [{ node = 0, param = "value1" }]

[[param]]
name = "tilt"
label = "Tilt"
default = 25.0
min = -90.0
max = 90.0
help = "Degrees the camera looks down on the solid (negative looks up)."
to = [{ node = 4, param = "elevation" }]

[[param]]
name = "distance"
label = "Distance"
default = 3.6
min = 1.2
max = 20.0
help = "Camera distance: lower is closer and bigger."
to = [{ node = 4, param = "distance" }]

[[param]]
name = "colour"
label = "Colour"
default = [0.9, 0.55, 0.25, 1.0]
help = "Surface colour; it multiplies the face colours and the texture."
to = [{ node = 3, param = "albedo" }]

[[param]]
name = "face_colours"
label = "Face Colours"
default = false
help = "Gives every face its own colour, around the hue circle."
to = [{ node = 2, param = "face_colours" }]

[[param]]
name = "roughness"
label = "Roughness"
default = 0.35
min = 0.02
max = 1.0
help = "0.02 is a sharp, mirror-like highlight; 1 a broad, dull one."
to = [{ node = 3, param = "roughness" }]

[[param]]
name = "metallic"
label = "Metallic"
default = 0.0
help = "0 looks like plastic, 1 like metal."
to = [{ node = 3, param = "metallic" }]

[[param]]
name = "emission"
label = "Emission"
default = [0.0, 0.0, 0.0, 1.0]
help = "Light the surface gives off, unaffected by lighting; bright colours glow through the bloom."
to = [{ node = 3, param = "emission" }]

[[param]]
name = "glow"
label = "Glow"
default = 0.5
min = 0.0
max = 4.0
help = "Bloom around highlights and emission."
to = [{ node = 5, param = "intensity" }]

[[param]]
name = "background"
label = "Background"
default = [0.02, 0.02, 0.04, 1.0]
help = "Colour behind the solid; alpha 0 makes it transparent for compositing."
to = [{ node = 4, param = "background" }]

[[input]]
name = "texture"
to = [{ node = 3, input = "map" }]

[[output]]
name = "out"
from = { node = 5, output = "out" }
