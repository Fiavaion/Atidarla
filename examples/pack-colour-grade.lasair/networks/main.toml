# Lasair network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 6

[[node]]
id = 0
name = "source"
type = "img.noise"
pos = [0.0, 80.0]
params.monochrome = false
params.octaves = 4
params.z = { value = 0.0, expr = "time * 0.15" }

[[node]]
id = 1
name = "warm"
type = "cmp.pack_colour_grade"
pos = [240.0, 0.0]
inputs.in = { node = 0, output = "out" }
params.contrast = 1.3
params.gamma = 1.1
params.saturation = 1.6
params.tint = [1.0, 0.75, 0.5, 1.0]
params.tint_amount = 0.35

[[node]]
id = 2
name = "cold"
type = "cmp.pack_colour_grade"
pos = [240.0, 160.0]
inputs.in = { node = 0, output = "out" }
params.contrast = 0.85
params.exposure = 1.1
params.saturation = 0.5
params.tint = [0.7, 0.85, 1.0, 1.0]
params.tint_amount = 0.5

[[node]]
id = 3
name = "left_half"
type = "img.shape"
pos = [240.0, -160.0]
params.background = [1.0, 1.0, 1.0, 0.0]
params.centre = [0.25, 0.5]
params.shape = "rectangle"
params.size = [0.889, 1.2]
params.softness = 0.0

[[node]]
id = 4
name = "masked"
type = "img.composite"
pos = [480.0, 0.0]
inputs.a = { node = 3, output = "out" }
inputs.b = { node = 1, output = "out" }
params.operation = "multiply"

[[node]]
id = 5
name = "split"
type = "img.composite"
pos = [720.0, 80.0]
inputs.a = { node = 4, output = "out" }
inputs.b = { node = 2, output = "out" }
