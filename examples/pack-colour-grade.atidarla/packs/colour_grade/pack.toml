# Atidarla Pack. Its network is network.toml; its help page is help.md.
format = 1
name = "colour_grade"
version = "1.0.0"
label = "Colour Grade"
summary = "The everyday colour controls in one place: exposure, contrast, gamma, saturation, hue and a colour tint."
locked = true

[[param]]
name = "exposure"
label = "Exposure"
default = 1.0
min = 0.0
max = 4.0
help = "Multiplies the brightness: 2 is twice as bright, 0.5 half."
to = [{ node = 0, param = "brightness" }]

[[param]]
name = "contrast"
label = "Contrast"
default = 1.0
min = 0.0
max = 4.0
help = "Spreads the tones apart from mid-grey (above 1) or pulls them together (below 1)."
to = [{ node = 0, param = "contrast" }]

[[param]]
name = "gamma"
label = "Gamma"
default = 1.0
min = 0.1
max = 4.0
help = "Brightens (above 1) or darkens (below 1) the mid-tones, leaving black and white in place."
to = [{ node = 0, param = "gamma" }]

[[param]]
name = "saturation"
label = "Saturation"
default = 1.0
min = 0.0
max = 4.0
help = "Colour intensity: 0 is black and white, 2 is vivid."
to = [{ node = 1, param = "saturation" }]

[[param]]
name = "hue"
label = "Hue"
default = 0.0
min = -180.0
max = 180.0
help = "Rotates every colour round the colour wheel (degrees)."
to = [{ node = 1, param = "hue" }]

[[param]]
name = "tint"
label = "Tint"
default = [1.0, 0.8, 0.6, 1.0]
help = "A colour the image is filtered through, like a gel on a light: warm, cool or anything."
to = [{ node = 2, param = "colour" }]

[[param]]
name = "tint_amount"
label = "Tint Amount"
default = 0.0
help = "How much of the Tint is applied: 0 is none, 1 is the full colour filter."
to = [{ node = 3, param = "opacity" }]

[[input]]
name = "in"
to = [{ node = 0, input = "in" }]

[[output]]
name = "out"
from = { node = 3, output = "out" }
