# Lasair network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 6

[[node]]
id = 0
name = "pulse"
type = "sig.lfo"
pos = [0.0, 0.0]
params.frequency = 0.5

[[node]]
id = 1
name = "clouds"
type = "img.noise"
pos = [0.0, 140.0]
params.octaves = 4
params.scale = 3.0

[[node]]
id = 2
name = "kaleido"
type = "img.kaleidoscope"
pos = [220.0, 140.0]
inputs.in = { node = 1, output = "out" }

[[node]]
id = 3
name = "tint"
type = "img.constant"
pos = [220.0, 280.0]
params.colour = [0.9, 0.3, 0.6, 1.0]

[[node]]
id = 4
name = "mix"
type = "img.composite"
pos = [440.0, 140.0]
inputs.a = { node = 2, output = "out" }
inputs.b = { node = 3, output = "out" }
params.operation = "multiply"

[[node]]
id = 5
name = "level1"
type = "img.level"
pos = [660.0, 140.0]
inputs.in = { node = 4, output = "out" }
