# Atidarla project. The patch is in networks/main.toml.
format = 1
name = "Mesh Modelling"
description = '''
MSH modelling (M2), each step on a worker thread. Left: a box whose middle top face grows a
chimney (Group by box, connected Extrude, its height following an expression of time), then
smoothed (Subdivide). Middle: a sphere with its upper right quarter cut away (Boolean
subtract, then Fuse), one random colour per primitive. Right: a torus with its upper half
deleted (Group by box, Delete), triangulated and reduced to a quarter of its triangles
(PolyReduce). Merged, tilted, drawn as points.

Try: change the Boolean's operation to intersect or union; lower PolyReduce's percentage; set
the extrude mode to individual with an inset; set the torus group's combine mode to subtract.
'''
resolution = [1280, 720]
