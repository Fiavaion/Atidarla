# Lasair project. The patch is in networks/main.toml.
format = 1
name = "Python operators"
description = '''
Operators written in Python, in this project's ops/ folder (docs/python-ops.md). Step
Counter (ops/motion.py) counts 1 to 8, two steps a second, and sets the number of rings;
Python LFO (same file) moves them outwards; Rings (ops/pattern.py) draws them in pure
Python at 64x64, and built-in Resolution and Level scale it up and adjust it.

Python operators are code that runs with your user's privileges, so the app asks before
it runs them, and `lasair check` and `render` need --allow-python-ops.

Try: open ops/motion.py, change how the counter counts, and save: the patch reloads it
and the count carries on from where it was (state survives hot reload).
'''
resolution = [512, 512]
