# Atidarla network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 12

[[node]]
id = 0
name = "system"
type = "pnt.particles"
pos = [0.0, 0.0]
inputs.prev = { node = 8, output = "out" }
params.attract = 0.0
params.capacity = 300000
params.curl_amplitude = 0.0
params.drag = 0.0
params.rate = 0.0

[[node]]
id = 1
name = "ring"
type = "pnt.scatter"
pos = [0.0, 160.0]
params.centre = [0.0, -0.85, 0.0]
params.count = 2000
params.radius = 0.12
params.rotate = [-90.0, 0.0, 0.0]
params.shape = "circle"

[[node]]
id = 2
name = "nozzle"
type = "pnt.emitter"
pos = [220.0, 0.0]
inputs.in = { node = 0, output = "out" }
