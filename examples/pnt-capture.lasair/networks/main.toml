# Lasair network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 23

[[node]]
id = 0
name = "depth_map"
type = "img.ramp"
pos = [0.0, 0.0]
params.colour_a = [1.0, 1.0, 1.0, 1.0]
params.colour_b = [0.0, 0.0, 0.0, 1.0]
params.type = "radial"

[[node]]
id = 1
name = "picture"
type = "img.noise"
pos = [0.0, 200.0]
params.monochrome = false
params.z = { value = 0.0, expr = "time * 0.2" }

[[node]]
id = 2
name = "dome"
type = "pnt.points_from_depth"
pos = [220.0, 0.0]
inputs.colour = { node = 1, output = "out" }
inputs.depth = { node = 0, output = "out" }
params.columns = 120
params.far = 2.5
params.near = 1.5
params.translate = [0.0, 0.0, 2.0]

[[node]]
id = 3
name = "dome_place"
type = "pnt.transform"
pos = [440.0, 0.0]
inputs.in = { node = 2, output = "out" }
params.rotate = [25.0, 35.0, 0.0]
params.translate = [-2.3, 1.0, 0.0]
params.uniform_scale = 0.35

[[node]]
id = 4
name = "relief"
type = "pnt.points_from_image"
pos = [220.0, 200.0]
inputs.image = { node = 1, output = "out" }
params.columns = 96
params.displace = 0.4
params.width = 1.8

[[node]]
id = 5
name = "bright_only"
type = "pnt.delete"
pos = [440.0, 200.0]
inputs.in = { node = 4, output = "out" }
params.attribute = "value"
params.compare = "<"
params.rule = "attribute"
params.value = 0.45

[[node]]
id = 6
name = "relief_place"
type = "pnt.transform"
pos = [660.0, 200.0]
inputs.in = { node = 5, output = "out" }
params.rotate = [-30.0, 0.0, 0.0]
params.translate = [0.0, 1.0, 0.0]

[[node]]
id = 7
name = "spiral"
type = "pnt.file_in"
pos = [220.0, 400.0]
params.file = "media/spiral.csv"

[[node]]
id = 8
name = "tint"
type = "pnt.attribute_from_image"
pos = [440.0, 400.0]
inputs.image = { node = 1, output = "out" }
inputs.in = { node = 7, output = "out" }
params.lookup = "planar"
params.operation = "multiply"
params.size = [1.0, 1.6]

[[node]]
id = 9
name = "spiral_place"
type = "pnt.transform"
pos = [660.0, 400.0]
inputs.in = { node = 8, output = "out" }
params.translate = [2.3, 1.0, 0.0]

[[node]]
id = 10
name = "sensor"
type = "pnt.sensor_in"
pos = [220.0, 600.0]
params.columns = 120

[[node]]
id = 11
name = "sensor_place"
type = "pnt.transform"
pos = [440.0, 600.0]
inputs.in = { node = 10, output = "out" }
params.pivot = [0.0, 0.0, -2.5]
params.rotate = [0.0, 20.0, 0.0]
params.translate = [-2.3, -1.0, 2.5]
params.uniform_scale = 0.4

[[node]]
id = 12
name = "lattice"
type = "pnt.file_in"
pos = [220.0, 800.0]
params.file = "media/lattice.ply"

[[node]]
id = 13
name = "lattice_place"
type = "pnt.transform"
pos = [440.0, 800.0]
inputs.in = { node = 12, output = "out" }
params.rotate = [30.0, 30.0, 0.0]
params.translate = [2.0, -1.0, 0.0]
params.uniform_scale = 0.8

[[node]]
id = 14
name = "pulse"
type = "pnt.file_in"
pos = [220.0, 1000.0]
params.file = "media/pulse.$F2.csv"
params.frame = { value = 1, expr = "int(time * 8) % 8 + 1" }

[[node]]
id = 15
name = "pulse_place"
type = "pnt.transform"
pos = [440.0, 1000.0]
inputs.in = { node = 14, output = "out" }
params.translate = [2.6, -1.0, 0.0]
params.uniform_scale = 0.8

[[node]]
id = 16
name = "top_row"
type = "pnt.merge"
pos = [880.0, 200.0]
inputs.a = { node = 3, output = "out" }
inputs.b = { node = 6, output = "out" }
inputs.c = { node = 9, output = "out" }
inputs.d = { node = 11, output = "out" }

[[node]]
id = 17
name = "everything"
type = "pnt.merge"
pos = [1100.0, 500.0]
inputs.a = { node = 16, output = "out" }
inputs.b = { node = 13, output = "out" }
inputs.c = { node = 15, output = "out" }

[[node]]
id = 18
name = "draw"
type = "img.render_points"
pos = [1320.0, 500.0]
inputs.geo = { node = 17, output = "out" }
params.height = 4.0
params.size = 2.0

[[node]]
id = 19
name = "joints"
type = "pnt.sensor_in"
pos = [220.0, 1200.0]
params.output = "body"
params.translate = [0.0, 0.0, 2.2]

[[node]]
id = 20
name = "joints_place"
type = "pnt.transform"
pos = [440.0, 1200.0]
inputs.in = { node = 19, output = "out" }
params.translate = [0.0, -0.9, 0.0]
params.uniform_scale = 0.7

[[node]]
id = 21
name = "draw_body"
type = "img.render_points"
pos = [660.0, 1200.0]
inputs.geo = { node = 20, output = "out" }
params.draw = "both"
params.height = 4.0
params.size = 5.0

[[node]]
id = 22
name = "stage"
type = "img.composite"
pos = [1540.0, 600.0]
inputs.a = { node = 18, output = "out" }
inputs.b = { node = 21, output = "out" }
params.operation = "add"
