# Atidarla network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 4

[[node]]
id = 0
name = "system"
type = "pnt.particles"
pos = [0.0, 0.0]
inputs.prev = { node = 1, output = "out" }
params.attract = 0.6
params.capacity = 400000
params.curl_amplitude = 1.5
params.curl_frequency = 1.2
params.initial = 100000
params.life = 5.0
params.radius = 0.3
params.rate = 60000.0
params.spread = 0.2

[[node]]
id = 1
name = "flow"
type = "pnt.noise"
pos = [220.0, 0.0]
inputs.in = { node = 0, output = "out" }
params.amplitude = 1.0
params.evolution = { value = 0.0, expr = "time * 0.2" }
params.frequency = 0.8
params.mode = "velocity"

[[node]]
id = 2
name = "draw"
type = "img.render_points"
pos = [440.0, 0.0]
inputs.geo = { node = 1, output = "out" }
params.height = 3.0
params.intensity = 0.35

[[node]]
id = 3
name = "glow"
type = "img.bloom"
pos = [660.0, 0.0]
inputs.in = { node = 2, output = "out" }
params.intensity = 0.6
params.threshold = 0.5
