# Lasair network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 2

[[node]]
id = 0
name = "clouds"
type = "img.noise"
pos = [0.0, 0.0]
params.monochrome = false
params.octaves = 4
params.z = { value = 0.0, expr = "time * 0.1" }

[[node]]
id = 1
name = "vignette1"
type = "cmp.pack_vignette"
pos = [240.0, 0.0]
inputs.in = { node = 0, output = "out" }
params.amount = 0.9
params.colour = [0.0, 0.05, 0.3, 1.0]
