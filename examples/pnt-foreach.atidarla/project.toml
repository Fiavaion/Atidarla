# Atidarla project. The patch is in networks/main.toml.
format = 1
name = "PNT For-Each"
description = '''
Two For-Each blocks (M2 PNT batch). In the first, For-Each in count mode runs its body six
times over one column of 4,000 points (Scatter, box): each pass's points carry `iteration`,
so Attribute Math fits it to an offset along X, Twist swirls the column, a second Attribute
Math moves it by the offset and Randomize, keyed by `iteration`, colours each copy. For-Each
End merges the six passes into one geometry, and its output wired back into For-Each's `end`
closes the block.

In the second, Piece numbers a strip of points by bands along X (attribute rule on P.x) and
For-Each in pieces mode gives pass k the band numbered k: each band gets its own colour and
Wave ripples them. Merge joins both blocks for Render Points and Bloom.

Try: For-Each iterations 3 or 12; Twist angle 360; Piece width 0.5 (more bands than passes:
the rest are left out until Iterations is raised).
'''
resolution = [1280, 720]
