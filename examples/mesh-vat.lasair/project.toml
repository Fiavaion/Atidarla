# Lasair project. The patch is in networks/main.toml.
format = 1
name = "VAT Playback"
description = '''
VAT In (FR-C2) playing two vertex animation texture sets in the Houdini VAT 3.0 layout, at
24 frames a second through an expression of time. Below: a soft-body ripple, a grid whose
points read their positions from a 16-bit PNG across the bounds in its data file. Above:
four rigid cubes tumbling, each a single texel of position and rotation in EXR, coloured
from an 8-bit PNG.

The files in `vat/` are small synthetic exports made by Lasair's own test generator
(`crates/lsr-ops-msh/tests/vat.rs`), not third-party content.

Try: set a node's frame to a fixed number; turn interpolate off and slow the expression down
to see the frames step; turn loop off.
'''
resolution = [1280, 720]
