# Atidarla network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 8

[[node]]
id = 0
name = "red"
type = "img.channel_mix"
pos = [0.0, 0.0]
params.blue = [0.0, 0.0, 0.0, 0.0]
params.green = [0.0, 0.0, 0.0, 0.0]

[[node]]
id = 1
name = "green"
type = "img.channel_mix"
pos = [0.0, 140.0]
params.alpha = [0.0, 0.0, 0.0, 0.0]
params.blue = [0.0, 0.0, 0.0, 0.0]
params.red = [0.0, 0.0, 0.0, 0.0]

[[node]]
id = 2
name = "blue"
type = "img.channel_mix"
pos = [0.0, 280.0]
params.alpha = [0.0, 0.0, 0.0, 0.0]
params.green = [0.0, 0.0, 0.0, 0.0]
params.red = [0.0, 0.0, 0.0, 0.0]

[[node]]
id = 3
name = "green_delay"
type = "img.cache"
pos = [220.0, 140.0]
inputs.in = { node = 1, output = "out" }
params.delay = 4

[[node]]
id = 4
