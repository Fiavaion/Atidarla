# Atidarla Pack. Its network is network.toml; its help page is help.md.
format = 1
name = "rgb_delay"
version = "1.0.0"
label = "RGB Delay"
summary = "Delays green and blue behind red, so anything moving leaves red, green and blue ghosts."
locked = true

[[param]]
name = "delay"
label = "Delay"
default = 4
min = 0.0
max = 60.0
help = "Frames green lags behind red; blue lags twice as far. 0 is no effect."
to = [{ node = 3, param = "delay" }]

[[param]]
name = "mix"
label = "Mix"
default = 1.0
help = "0 shows the original image, 1 the split channels."
to = [{ node = 7, param = "opacity" }]

[[input]]
name = "in"
to = [{ node = 0, input = "in" }, { node = 1, input = "in" }, { node = 2, input = "in" }, { node = 7, input = "b" }]

[[output]]
name = "out"
from = { node = 7, output = "out" }
