# Atidarla network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 4

[[node]]
id = 0
name = "bar"
type = "img.shape"
pos = [0.0, 0.0]
params.background = [0.0, 0.0, 0.0, 1.0]
params.rotate = { value = 0.0, expr = "time * 120" }
params.shape = "rectangle"
params.size = [1.4, 0.08]

[[node]]
id = 1
name = "triangle"
type = "img.shape"
pos = [0.0, 160.0]
params.rotate = { value = 0.0, expr = "time * -90" }
params.shape = "polygon"
params.sides = 3
params.size = [0.45, 0.45]

[[node]]
id = 2
name = "shapes"
type = "img.composite"
pos = [240.0, 80.0]
inputs.a = { node = 1, output = "out" }
inputs.b = { node = 0, output = "out" }
params.operation = "maximum"

[[node]]
id = 3
name = "delay1"
type = "cmp.pack_rgb_delay"
pos = [480.0, 80.0]
inputs.in = { node = 2, output = "out" }
params.delay = 6
