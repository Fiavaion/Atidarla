# Lasair project. The patch is in networks/main.toml.
format = 1
name = "Pack: Audio Pulse"
description = '''
A drum loop drives the Audio Pulse Pack: the noise brightens and glows on every hit.

The Pack also outputs its smoothed loudness as a SIG channel, `level`; the HSV Adjust after it
reads that channel in an expression, `op('pulse1')['level'] * 60`, so the hue jumps with the
music too.

Try: raise Release for a slower, breathing pulse, or wire an Audio In to the Pack's audio input.
'''
resolution = [1280, 720]
