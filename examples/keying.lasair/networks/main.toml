# Lasair network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 8

[[node]]
id = 0
name = "footage"
type = "img.movie_in"
pos = [0.0, 0.0]
params.file = "media/greenscreen.png"

[[node]]
id = 1
name = "key"
type = "img.chroma_key"
pos = [220.0, 0.0]
inputs.in = { node = 0, output = "out" }
params.key = [0.08, 0.78, 0.24, 1.0]
params.softness = 0.1
params.tolerance = 0.3

[[node]]
