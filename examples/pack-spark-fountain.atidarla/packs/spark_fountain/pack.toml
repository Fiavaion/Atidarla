# Atidarla Pack. Its network is network.toml; its help page is help.md.
format = 1
name = "spark_fountain"
version = "1.0.0"
label = "Spark Fountain"
summary = "A self-running particle fountain: sparks shoot up, swirl, fall and bounce off the floor, coloured by their speed."
locked = true

[[param]]
name = "rate"
label = "Rate"
default = 30000.0
min = 0.0
max = 60000.0
help = "Sparks born per second."
to = [{ node = 2, param = "rate" }]

[[param]]
name = "force"
label = "Force"
default = 2.6
min = 0.0
max = 8.0
help = "Launch speed out of the nozzle: how high the jet goes."
to = [{ node = 2, param = "normal_speed" }]

[[param]]
name = "spread"
label = "Spread"
default = 0.3
min = 0.0
max = 2.0
help = "Random speed added in any direction: 0 is a tight jet, 1 a wide spray."
to = [{ node = 2, param = "spread" }]

[[param]]
name = "life"
label = "Life"
default = 3.0
min = 0.1
max = 6.0
help = "Seconds a spark lives."
to = [{ node = 2, param = "life" }]

[[param]]
name = "gravity"
label = "Gravity"
default = [0.0, -2.4, 0.0]
help = "Pull on every spark (x, y, z, per second squared); a sideways x leans the fountain over."
to = [{ node = 3, param = "acceleration" }]

[[param]]
name = "stir"
label = "Stir"
default = 0.6
min = 0.0
max = 8.0
help = "Strength of the swirling air that bends the sparks."
to = [{ node = 4, param = "amplitude" }]

[[param]]
name = "bounce"
label = "Bounce"
default = 0.4
min = 0.0
max = 1.0
help = "Share of their speed the sparks keep when they hit the floor."
to = [{ node = 6, param = "bounce" }]

[[param]]
name = "palette"
label = "Palette"
default = "heat"
help = "Colours from slow to fast: `heat` (embers to white), `ice`, `rainbow`, or the two- and three-colour ramps' defaults."
to = [{ node = 7, param = "ramp" }]

[[param]]
name = "size"
label = "Size"
default = 2.0
min = 0.5
max = 16.0
help = "Spark size in pixels."
to = [{ node = 8, param = "size" }]

[[param]]
name = "glow"
label = "Glow"
default = 0.6
min = 0.0
max = 4.0
help = "Bloom around the brightest sparks."
to = [{ node = 9, param = "intensity" }]

[[output]]
name = "out"
from = { node = 9, output = "out" }
