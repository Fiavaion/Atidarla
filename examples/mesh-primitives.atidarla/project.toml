# Atidarla project. The patch is in networks/main.toml.
format = 1
name = "Mesh Primitives"
description = '''
MSH primitives (M2), cooked on worker threads: a subdivided box, an icosphere, a torus and a
cone in a row, a ground grid, a horizon line and a circle outline, merged, coloured from
their normals, gently pulsing through a Transform, exported to .cache/primitives.glb and drawn
as points.

Render Points shows the vertices (a mesh renderer arrives with the MAT/3D work). The mesh is
written to the project's .cache/ folder each time it changes; open it in a glTF viewer.

Try: raise the box's subdivision levels; switch the sphere to polar; set the colour mode to
random_prim; change the export file's extension to .obj or .ply.
'''
resolution = [1280, 720]
