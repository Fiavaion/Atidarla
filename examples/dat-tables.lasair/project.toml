# Lasair project. The patch is in networks/main.toml.
format = 1
name = "DAT tables"
description = '''
Text and tables on DAT wires. `cast` is a Table typed in; `lights` selects the names and cities
of the lighting crew from it (a match on the role column); `as_json` converts it to JSON and
`parsed` reads the second person back as name/value rows. `csv` is comma-separated Text that
`csv_table` splits into a table. `prompt` is a Prompt Template filled from the `words` table,
the `note` text and the `lfo` channel, ready for LLM Chat or a diffusion prompt. `swatch` is
grey at the brightness of a row of the `looks` table, stepping to the next row each second: its
colour is the expression `op('looks')[1 + int(time) % 3, 'level']` (the row by number, the
column by its header).

Try: view each node in the Viewer; edit a row of `cast` and watch only the nodes downstream of it
cook again; change `prompt`'s template; change a level in `looks`, or ask `swatch` for a row
that is not there and read its error.
'''
resolution = [1280, 720]
