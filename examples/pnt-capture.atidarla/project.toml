# Atidarla project. The patch is in networks/main.toml.
format = 1
name = "PNT Capture"
description = '''
Capture-to-stage on the GPU (M6, D12). Six small scenes, laid out in two rows:

Top: a radial ramp read as AI-style depth (bright is near) and back-projected by Points from
Depth, coloured by animated noise and turned to show its relief; the same noise as a grid of
points (Points from Image) pushed out by its brightness, with the dark half removed by Delete
on `value`; a helix read from media/spiral.csv (Point File In) and tinted by the noise image
projected onto it (Attribute from Image).

Bottom: Sensor In's test scene (a waving figure in front of a wall, as a depth sensor sees
it); its body tracking, 32 joints and their bones drawn as lines; a lattice from an ASCII PLY
and a pulsing ring played from the CSV sequence media/pulse.$F2.csv (eight frames, `frame`
driven by time).

Live Kinect / Orbbec capture (Sensor In's k4a device) needs Windows with the K4A SDK; the test
scene and recordings run everywhere. Convert your own caches with `atidarla points convert`
(docs/point-caches.md).

Try: Points from Depth encoding linear; Points from Image displace 1; Sensor In output body on
the first sensor node; Attribute from Image operation set.
'''
resolution = [1280, 720]
