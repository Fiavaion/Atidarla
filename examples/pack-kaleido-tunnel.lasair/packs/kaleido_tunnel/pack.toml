# Lasair Pack. Its network is network.toml; its help page is help.md.
format = 1
name = "kaleido_tunnel"
version = "1.0.1"
label = "Kaleidoscope Tunnel"
summary = "A self-running generator: coloured noise drifting through a turning kaleidoscope, mirrored, tiled and glowing."
locked = true

[[param]]
name = "speed"
label = "Speed"
default = 0.3
min = -4.0
max = 4.0
help = "How fast the noise drifts through the kaleidoscope."
to = [{ node = 0, param = "value1" }]

[[param]]
name = "segments"
label = "Segments"
default = 8
max = 32.0
help = "How many mirrored segments the kaleidoscope folds the noise into (1 to 32)."
to = [{ node = 5, param = "segments" }]

[[param]]
name = "scale"
label = "Scale"
default = 2.5
min = 0.1
max = 20.0
help = "Size of the noise features: higher is finer."
to = [{ node = 4, param = "scale" }]

[[param]]
name = "repeat"
label = "Repeat"
default = [2.0, 2.0]
help = "How many times the tunnel is tiled across and down."
to = [{ node = 7, param = "repeat" }]

[[param]]
name = "hue_speed"
label = "Hue Speed"
default = 0.05
min = 0.0
max = 2.0
help = "How fast the colours swing (cycles per second)."
to = [{ node = 3, param = "frequency" }]

[[param]]
name = "glow"
label = "Glow"
default = 0.8
min = 0.0
max = 4.0
help = "Strength of the glow around the bright parts: 0 is none."
to = [{ node = 9, param = "intensity" }]

[[output]]
name = "out"
from = { node = 9, output = "out" }
