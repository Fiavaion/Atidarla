# Atidarla network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 8

[[node]]
id = 0
name = "ring"
type = "msh.circle"
pos = [0.0, 0.0]
params.divisions = 12
params.radius = 0.8
params.type = "polyline"

[[node]]
id = 1
name = "even"
type = "pnt.resample"
pos = [220.0, 0.0]
inputs.in = { node = 0, output = "out" }
params.count = 60
params.mode = "count"

[[node]]
id = 2
name = "ripple"
type = "pnt.wave"
pos = [440.0, 0.0]
inputs.in = { node = 1, output = "out" }
params.amplitude = 0.15
params.direction = [0.0, 0.0, 1.0]
params.phase = { value = 0.0, expr = "time * 120" }
params.wavelength = 0.8

[[node]]
id = 3
name = "tint"
type = "pnt.colour"
pos = [660.0, 0.0]
inputs.in = { node = 2, output = "out" }
params.high = 0.15
params.low = -0.15
params.measure = "z"
params.ramp = "rainbow"

[[node]]
id = 4
name = "draw"
type = "img.render_points"
pos = [880.0, 0.0]
inputs.geo = { node = 3, output = "out" }
params.size = 6.0

[[node]]
id = 5
name = "positions"
type = "pnt.to_channels"
pos = [880.0, 200.0]
inputs.in = { node = 2, output = "out" }
params.max = 8

[[node]]
id = 6
name = "lights"
type = "pnt.pixel_out"
pos = [880.0, 400.0]
inputs.in = { node = 3, output = "out" }
params.patch = "patch.toml"
params.universe = 1

[[node]]
id = 7
name = "dmx_out1"
type = "sig.dmx_out"
pos = [1100.0, 400.0]
inputs.in = { node = 6, output = "out" }
params.host = "127.0.0.1"
