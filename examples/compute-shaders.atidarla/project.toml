# Atidarla project. The patch is in networks/main.toml.
format = 1
name = "Compute Shaders"
description = '''
WGSL compute shaders as operators (Compute). Each one is a kernel run once per pixel, with
#bind lines that declare its images, named parameters and buffers.

blur is a box blur whose radius is the named parameter radius (P1). heat diffuses an orbiting
dot: a state image loaded from the input and stepped 24 times per frame. trails lives in
compute/trails.wgsl (save the file and it recompiles while the old shader keeps running): a
state image remembers where the dot was, and a buffer with one number per pixel ages the trail
from blue to white.

Try: P1 of blur; Iterations of heat; Tile on any of them (the image stays the same); edit
compute/trails.wgsl while the project runs.
'''
resolution = [1280, 720]
