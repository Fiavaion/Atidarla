# Atidarla network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 9

[[node]]
id = 0
name = "drift"
type = "sig.lfo"
pos = [0.0, 0.0]
params.amplitude = 180.0
params.frequency = 0.15
params.offset = 180.0
params.waveform = "ramp"

[[node]]
id = 1
name = "dot"
type = "img.shape"
pos = [0.0, 140.0]
params.centre = [0.75, 0.5]
params.size = [0.05, 0.05]

[[node]]
id = 2
name = "orbit"
type = "img.transform"
pos = [220.0, 140.0]
inputs.in = { node = 1, output = "out" }
params.rotate = { value = 0.0, bind = { node = 0, channel = "lfo" } }

[[node]]
id = 3
name = "texture"
type = "img.noise"
pos = [0.0, 280.0]
params.monochrome = false
params.scale = 6.0

[[node]]
id = 4
name = "blur"
type = "img.compute"
pos = [220.0, 280.0]
inputs.in0 = { node = 3, output = "out" }
params.code = '''
#bind input in0
#bind output dst
#bind param p1 radius f32

// A box blur of radius() pixels, edges clamped.
fn kernel(id: vec2u) {
    let r = i32(clamp(radius(), 0.0, 16.0));
    let last = vec2i(size()) - 1;
    var sum = vec4f(0.0);
    for (var dy = -r; dy <= r; dy++) {
        for (var dx = -r; dx <= r; dx++) {
            sum += textureLoad(in0, clamp(vec2i(id) + vec2i(dx, dy), vec2i(0), last), 0);
        }
    }
    textureStore(dst, id, sum / f32((2 * r + 1) * (2 * r + 1)));
}
'''
params.p1 = [4.0, 0.0, 0.0, 0.0]
params.tile = "16x16"

[[node]]
id = 5
name = "heat"
type = "img.compute"
pos = [440.0, 140.0]
inputs.in0 = { node = 2, output = "out" }
params.code = '''
#bind state heat rgba16float from=in0

// One explicit diffusion step per iteration; the state starts from in0.
fn kernel(id: vec2u) {
    let p = vec2i(id);
    let last = vec2i(size()) - 1;
    let c = textureLoad(heat, p, 0);
    let n = textureLoad(heat, clamp(p - vec2i(1, 0), vec2i(0), last), 0)
          + textureLoad(heat, clamp(p + vec2i(1, 0), vec2i(0), last), 0)
          + textureLoad(heat, clamp(p - vec2i(0, 1), vec2i(0), last), 0)
          + textureLoad(heat, clamp(p + vec2i(0, 1), vec2i(0), last), 0);
    textureStore(heat_out, id, c + 0.24 * (n - 4.0 * c));
}
'''
params.iterations = 24

[[node]]
id = 6
name = "trails"
type = "img.compute"
pos = [440.0, 280.0]
inputs.in0 = { node = 2, output = "out" }
params.file = "compute/trails.wgsl"
params.p1 = [0.97, 0.0, 0.0, 0.0]
params.p2 = [0.2, 0.4, 1.0, 0.0]

[[node]]
id = 7
name = "glow"
type = "img.composite"
pos = [660.0, 210.0]
inputs.a = { node = 5, output = "out" }
inputs.b = { node = 6, output = "out" }
params.operation = "add"

[[node]]
id = 8
name = "screen"
type = "img.composite"
pos = [880.0, 280.0]
inputs.a = { node = 7, output = "out" }
inputs.b = { node = 4, output = "out" }
params.opacity = 0.3
params.operation = "add"
