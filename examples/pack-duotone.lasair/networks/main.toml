# Lasair network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 3

[[node]]
id = 0
name = "clouds"
type = "img.noise"
pos = [0.0, 0.0]
params.octaves = 5
params.z = { value = 0.0, expr = "time * 0.15" }

[[node]]
id = 1
name = "title"
type = "img.text"
pos = [240.0, 0.0]
inputs.in = { node = 0, output = "out" }
params.size = 0.2
params.text = "DUOTONE"

[[node]]
id = 2
name = "duotone1"
type = "cmp.pack_duotone"
pos = [480.0, 0.0]
inputs.in = { node = 1, output = "out" }
params.contrast = 2.0
params.highlights = [0.3, 1.0, 0.95, 1.0]
params.shadows = [0.35, 0.0, 0.3, 1.0]
