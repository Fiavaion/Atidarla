# Atidarla Pack. Its network is network.toml; its help page is help.md.
format = 1
name = "neon_edges"
version = "1.0.0"
label = "Neon Edges"
summary = "Traces the outlines of an image in glowing, saturated colour and lays them over it."
locked = true

[[param]]
name = "strength"
label = "Strength"
default = 3.0
min = 0.0
max = 16.0
help = "How strongly edges are picked up."
to = [{ node = 0, param = "strength" }]

[[param]]
name = "width"
label = "Width"
default = 5.0
min = 0.0
max = 64.0
help = "Blur radius of the outlines in pixels: wider lines, softer glow."
to = [{ node = 1, param = "size" }]

[[param]]
name = "glow"
label = "Glow"
default = 5.0
min = 0.0
max = 10.0
help = "Brightness of the outlines."
to = [{ node = 2, param = "brightness" }]

[[param]]
name = "hue"
label = "Hue"
default = 0.0
min = -180.0
max = 180.0
help = "Rotates the outline colours (degrees)."
to = [{ node = 3, param = "hue" }]

[[param]]
name = "saturation"
label = "Saturation"
default = 1.6
min = 0.0
max = 4.0
to = [{ node = 3, param = "saturation" }]

[[param]]
name = "mix"
label = "Mix"
default = 1.0
help = "How much of the outlines is laid over the image."
to = [{ node = 4, param = "opacity" }]

[[input]]
name = "in"
to = [{ node = 0, input = "in" }, { node = 4, input = "a" }]

[[output]]
name = "out"
from = { node = 4, output = "out" }
