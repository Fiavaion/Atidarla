# Lasair network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 8

[[node]]
id = 0
name = "drift"
type = "sig.lfo"
pos = [0.0, 0.0]
params.frequency = 0.2

[[node]]
id = 1
name = "sky"
type = "img.ramp"
pos = [220.0, 0.0]
params.colour_a = [0.1, 0.2, 0.6, 1.0]
params.colour_b = [0.9, 0.3, 0.2, 1.0]

[[node]]
id = 2
name = "clouds"
type = "img.noise"
pos = [220.0, 140.0]
params.scale = 6.0
params.z = { value = 0.0, bind = { node = 0, channel = "lfo" } }

[[node]]
id = 3
name = "sky_clouds"
type = "img.composite"
pos = [440.0, 60.0]
inputs.a = { node = 2, output = "out" }
inputs.b = { node = 1, output = "out" }
params.opacity = 0.35
params.operation = "add"

[[node]]
id = 4
name = "sun"
type = "img.shape"
pos = [440.0, 220.0]
params.fill = [1.0, 0.9, 0.4, 1.0]
params.size = [0.35, 0.35]

[[node]]
id = 5
name = "scene"
type = "img.composite"
pos = [660.0, 120.0]
inputs.a = { node = 4, output = "out" }
inputs.b = { node = 3, output = "out" }
params.operation = "over"

[[node]]
id = 6
name = "left"
type = "cmp.window"
pos = [880.0, 40.0]
inputs.in = { node = 5, output = "out" }
params.height = 720
params.position = [40.0, 60.0]
params.slices = '''
[slice upper]
source = 0 0 0.55 0.5
dst = 0 0 1 0.5
blend = 0 0.1818 0 0

[slice lower]
source = 0 0.5 0.55 0.5
warp = perspective
points = 0.02 0.5 1 0.5
points = 0.08 1 0.97 0.98
blend = 0 0.1818 0 0
'''
params.title = "Left projector"
params.width = 1280
params.window_size = [640.0, 360.0]

[[node]]
id = 7
name = "right"
type = "cmp.window"
pos = [880.0, 200.0]
inputs.in = { node = 5, output = "out" }
params.height = 720
params.position = [700.0, 60.0]
params.slices = '''
[slice upper]
source = 0.45 0 0.55 0.5
dst = 0 0 1 0.5
blend = 0.1818 0 0 0

[slice lower]
source = 0.45 0.5 0.55 0.5
warp = catmull_rom
grid = 3 3
points = 0 0.5 0.5 0.5 1 0.5
points = 0 0.75 0.53 0.77 1 0.75
points = 0 1 0.5 0.98 1 1
blend = 0.1818 0 0 0
mask = 0 0.5 1 0.5 1 0.85 0.85 1 0 1
'''
params.title = "Right projector"
params.width = 1280
params.window_size = [640.0, 360.0]
