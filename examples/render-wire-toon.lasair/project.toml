# Lasair project. The patch is in networks/main.toml.
format = 1
name = "Render Wire and Toon"
description = '''
Stylised 3D (M2): a cel-shaded icosahedron, a wireframe dodecahedron whose back edges show
through, and a cloud of points drawn as little lit spheres, all in one render with one
depth buffer.

Toon bands the light between two colours and adds a rim light; Line draws polygon sides (not
the diagonals the renderer adds) a set number of pixels wide; Point Sprite draws a geometry's
points facing the camera, sized in world units.

Try: turn on Line's fill (hidden-line look); set Toon's bands to 1; raise the sprite size.
'''
resolution = [1280, 720]
