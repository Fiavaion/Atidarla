# Lasair network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 2

[[node]]
id = 0
name = "pattern"
type = "img.kernel"
pos = [0.0, 0.0]
params.code = '''
// Drifting rings over noise: a generator (nothing is connected).
vec2 c = (@P - set(0.5, 0.5)) * set(@res.x / @res.y, 1);
float rings = 0.5 + 0.5 * sin(length(c) * ch("rings", 40.0) - @Time * 3.0);
float n = simplex(set(c.x * 3.0, c.y * 3.0 + @Time * 0.2)) * 0.5 + 0.5;
@Cd = vec4(rings * n, rings * 0.6, n, 1);
'''

[[node]]
id = 1
name = "grade"
type = "kernel.grade"
pos = [220.0, 0.0]
inputs.in0 = { node = 0, output = "out" }
params.gain = [1.2, 1.0, 0.8]
params.gamma = 1.3
params.vignette = 0.6
