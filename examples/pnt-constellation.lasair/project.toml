# Lasair project. The patch is in networks/main.toml.
format = 1
name = "PNT Constellation"
description = '''
Neighbour searches on the GPU (M2 PNT batch). 5,000 points on a sphere (Scatter) flow under
animated noise (Noise) and are relaxed by their neighbours (Smooth). Normals estimates each
point's surface normal from its neighbours, and Colour by Attribute shades by how much it faces
the viewer (N.z, ice ramp). Sort orders them back to front so Render Points' over blending
hides the far side, and Connect links each point to its two nearest neighbours: Render Points
draws the lines under the sprites. Behind, a field of stars: Scatter (box), a random Subset
and random colours (Randomize), composited with the sphere.

The grid hash behind Smooth, Normals and Connect is rebuilt every frame from the moving
points, in a fixed order, so the picture is the same on every run.

Try: Connect links 4 and radius 0.25; Smooth iterations 4; Normals orient none (patchy
shading: either side); Sort descending.
'''
resolution = [1280, 720]
