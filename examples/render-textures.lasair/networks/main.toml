# Lasair network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 7

[[node]]
id = 0
name = "square"
type = "msh.platonic"
pos = [0.0, 0.0]
params.centre = [-0.85, 0.0, 0.0]
params.radius = 1.0
params.shape = "polygon"

[[node]]
id = 1
name = "noise"
type = "img.noise"
pos = [0.0, 140.0]
params.monochrome = false
params.z = { value = 0.0, expr = "time * 0.3" }

[[node]]
id = 2
name = "screen"
type = "mat.unlit"
pos = [220.0, 140.0]
inputs.map = { node = 1, output = "out" }

[[node]]
id = 3
name = "dodeca"
type = "msh.platonic"
pos = [0.0, 280.0]
params.centre = [0.9, 0.0, 0.0]
params.radius = 0.75
params.shape = "dodecahedron"

[[node]]
id = 4
name = "sphere_look"
type = "img.ramp"
pos = [0.0, 420.0]
params.colour_a = [1.0, 0.95, 0.85, 1.0]
params.colour_b = [0.05, 0.1, 0.3, 1.0]
params.type = "radial"

[[node]]
id = 5
name = "clay"
type = "mat.matcap"
pos = [220.0, 420.0]
inputs.matcap = { node = 4, output = "out" }

[[node]]
id = 6
name = "render"
type = "img.render"
pos = [440.0, 200.0]
inputs.geo = { node = 0, output = "out" }
inputs.geo2 = { node = 3, output = "out" }
inputs.mat = { node = 2, output = "out" }
inputs.mat2 = { node = 5, output = "out" }
params.azimuth = { value = 0.0, expr = "35 * sin(time * 0.7)" }
params.background = [0.08, 0.08, 0.1, 1.0]
params.cull = "none"
params.elevation = { value = 0.0, expr = "10 * sin(time * 0.4)" }
