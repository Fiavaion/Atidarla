# Atidarla network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 3

[[node]]
id = 0
name = "wheel"
type = "img.ramp"
pos = [0.0, 0.0]
params.colour_a = [1.0, 0.2, 0.4, 1.0]
params.colour_b = [0.1, 0.3, 1.0, 1.0]
params.type = "angular"

[[node]]
id = 1
name = "flash1"
type = "cmp.pack_beat_flash"
pos = [240.0, 0.0]
inputs.in = { node = 0, output = "out" }
params.bpm = 128.0

[[node]]
id = 2
name = "kick"
type = "img.transform"
pos = [480.0, 0.0]
inputs.in = { node = 1, output = "out" }
params.extend = "mirror"
params.rotate = { value = 0.0, expr = "op('flash1')['trigger'] * 12 - 12" }
