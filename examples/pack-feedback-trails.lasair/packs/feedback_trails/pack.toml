# Lasair Pack. Its network is network.toml; its help page is help.md.
format = 1
name = "feedback_trails"
version = "1.0.0"
label = "Feedback Trails"
summary = "Leaves fading, zooming, hue-shifting trails behind whatever moves in the input."
locked = true

[[param]]
name = "decay"
label = "Decay"
default = 0.95
min = 0.0
max = 1.0
help = "How much of the trail survives each frame: 0 shows no trail, 1 never fades."
to = [{ node = 2, param = "brightness" }]

[[param]]
name = "zoom"
label = "Zoom"
default = [1.02, 1.02]
help = "Scale applied to the trail every frame: above 1 the trail flies outwards, below 1 it falls inwards."
to = [{ node = 1, param = "scale" }]

[[param]]
name = "spin"
label = "Spin"
default = 0.5
min = -45.0
max = 45.0
help = "Degrees the trail turns every frame (counter-clockwise)."
to = [{ node = 1, param = "rotate" }]

[[param]]
name = "hue_shift"
label = "Hue Shift"
default = 3.0
min = -180.0
max = 180.0
help = "Degrees the trail's hue rotates every frame; 0 keeps its colour."
to = [{ node = 3, param = "hue" }]

[[param]]
name = "blend"
label = "Blend"
default = "maximum"
help = "How the new frame meets the trail: `maximum` keeps the brightest, `add` builds up light, `over` draws the input on top."
to = [{ node = 4, param = "operation" }]

[[param]]
name = "reset"
label = "Reset"
default = false
help = "While on, clears the trail."
to = [{ node = 0, param = "reset" }]

[[input]]
name = "in"
to = [{ node = 0, input = "in" }, { node = 4, input = "a" }]

[[output]]
name = "out"
from = { node = 4, output = "out" }
