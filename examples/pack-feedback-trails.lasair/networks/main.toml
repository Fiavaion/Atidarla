# Lasair network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 4

[[node]]
id = 0
name = "swing"
type = "sig.lfo"
pos = [0.0, 0.0]
params.amplitude = 2.0
params.frequency = 0.1

[[node]]
id = 1
name = "triangle"
type = "img.shape"
pos = [0.0, 160.0]
params.background = [0.0, 0.0, 0.0, 1.0]
params.centre = [0.72, 0.5]
params.fill = [1.0, 0.6, 0.2, 1.0]
params.rotate = { value = 0.0, expr = "time * 240" }
params.shape = "polygon"
params.sides = 3
params.size = [0.12, 0.12]

[[node]]
id = 2
name = "orbit"
type = "img.transform"
pos = [240.0, 160.0]
inputs.in = { node = 1, output = "out" }
params.extend = "hold"
params.rotate = { value = 0.0, expr = "time * 90" }

[[node]]
id = 3
name = "trails1"
type = "cmp.pack_feedback_trails"
pos = [480.0, 160.0]
inputs.in = { node = 2, output = "out" }
params.spin = { value = 0.5, bind = { node = 0, channel = "lfo" } }
