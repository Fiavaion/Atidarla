# Atidarla network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 6

[[node]]
id = 0
name = "wave1"
type = "sig.lfo"
pos = [0.0, 0.0]
params.frequency = 0.25

[[node]]
id = 1
name = "wave2"
type = "sig.lfo"
pos = [0.0, 140.0]
params.frequency = 0.25
params.phase = 0.25

[[node]]
id = 2
name = "wave3"
type = "sig.lfo"
pos = [0.0, 280.0]
params.frequency = 0.25
params.phase = { value = 0.5, expr = "2 * op('wave2').par.phase" }

[[node]]
id = 3
name = "wave4"
type = "sig.lfo"
pos = [0.0, 420.0]
params.frequency = 0.25
params.phase = { value = 0.75, expr = "3 * op('wave2').par.phase" }

[[node]]
id = 4
name = "bank"
type = "sig.constant"
pos = [220.0, 210.0]
params.name1 = "lfo1"
params.name2 = "lfo2"
params.name3 = "lfo3"
params.name4 = "lfo4"
params.value1 = { value = 0.0, bind = { node = 0, channel = "lfo" } }
params.value2 = { value = 0.0, bind = { node = 1, channel = "lfo" } }
params.value3 = { value = 0.0, bind = { node = 2, channel = "lfo" } }
params.value4 = { value = 0.0, bind = { node = 3, channel = "lfo" } }

[[node]]
id = 5
name = "range"
type = "sig.math"
pos = [440.0, 210.0]
inputs.a = { node = 4, output = "out" }
params.from_min = -1.0
