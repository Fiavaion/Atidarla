# Atidarla network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 5

[[node]]
id = 0
name = "counter1"
type = "py.motion.counter"
pos = [0.0, 0.0]
params.rate = 2.0

[[node]]
id = 1
name = "wobble1"
type = "py.motion.wobble"
pos = [0.0, 140.0]
params.amplitude = 0.5
params.frequency = 0.5
params.shape = "triangle"

[[node]]
id = 2
name = "rings1"
type = "py.pattern.rings"
pos = [220.0, 0.0]
params.phase = { value = 0.0, bind = { node = 1, channel = "wobble" } }
params.rings = { value = 4, bind = { node = 0, channel = "count" } }

[[node]]
id = 3
name = "resolution1"
type = "img.resolution"
pos = [440.0, 0.0]
inputs.in = { node = 2, output = "out" }
params.fraction = 8.0

[[node]]
id = 4
name = "level1"
type = "img.level"
pos = [660.0, 0.0]
inputs.in = { node = 3, output = "out" }
params.contrast = 1.2
