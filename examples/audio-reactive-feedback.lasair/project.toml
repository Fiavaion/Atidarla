# Lasair project. The patch is in networks/main.toml.
format = 1
name = "Audio-reactive feedback"
description = '''
The M1 acceptance patch (AC1): a feedback loop whose brightness and spin follow a drum loop.

Audio File In plays media/beat.wav; Spectrum turns it into bands and a level. Noise feeds a
Feedback loop: each frame the previous output is zoomed in slightly and turned by the bass
band, then laid over fresh noise, so trails stream outwards. Math maps the loudness to
Level's brightness, so every hit flashes.

Try: set Transform's scale below 1 to pull the trails inwards, or bind Composite's opacity to
band5.
'''
resolution = [1280, 720]
