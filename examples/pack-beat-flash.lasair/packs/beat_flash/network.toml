# Lasair network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 5

[[node]]
id = 0
name = "clock"
type = "sig.beat"
pos = [0.0, 0.0]

[[node]]
id = 1
name = "phase"
type = "sig.select"
pos = [220.0, 0.0]
inputs.in = { node = 0, output = "out" }
params.channels = "beat_phase"

[[node]]
id = 2
name = "on_beat"
type = "sig.trigger"
pos = [440.0, 0.0]
inputs.in = { node = 1, output = "out" }
params.attack = 0.005
params.decay = 0.3
params.threshold = 0.02

[[node]]
id = 3
name = "boost"
type = "sig.math"
pos = [660.0, 0.0]
inputs.a = { node = 2, output = "out" }
params.to_max = 2.5
params.to_min = 1.0

[[node]]
id = 4
name = "flash"
type = "img.level"
pos = [660.0, 160.0]
params.brightness = { value = 1.0, bind = { node = 3, channel = "trigger" } }
