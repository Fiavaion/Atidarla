# Lasair Pack. Its network is network.toml; its help page is help.md.
format = 1
name = "beat_flash"
version = "1.0.0"
label = "Beat Flash"
summary = "Flashes an image brighter on every beat of a tempo clock, and outputs the flash envelope."
locked = true

[[param]]
name = "bpm"
label = "BPM"
default = 120.0
min = 1.0
max = 400.0
help = "Tempo in beats per minute."
to = [{ node = 0, param = "bpm" }]

[[param]]
name = "decay"
label = "Decay"
default = 0.3
min = 0.0
max = 4.0
help = "Seconds a flash takes to fade."
to = [{ node = 2, param = "decay" }]

[[param]]
name = "intensity"
label = "Intensity"
default = 2.5
min = 1.0
max = 10.0
help = "Brightness at the peak of a flash (1 is no flash)."
to = [{ node = 3, param = "to_max" }]

[[param]]
name = "restart"
label = "Restart"
default = false
help = "While on, holds the clock at the start of a bar."
to = [{ node = 0, param = "reset" }]

[[input]]
name = "in"
to = [{ node = 4, input = "in" }]

[[output]]
name = "out"
from = { node = 4, output = "out" }

[[output]]
name = "flash"
from = { node = 3, output = "out" }
