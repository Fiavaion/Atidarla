# Lasair network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 4

[[node]]
id = 0
name = "noise1"
type = "img.noise"
pos = [0.0, 0.0]
params.monochrome = false

[[node]]
id = 1
name = "invert1"
type = "ai.model"
pos = [220.0, 0.0]
inputs.image = { node = 0, output = "out" }
params.effect = 0.0
params.model = "builtin.invert"
params.policy = "hold"

[[node]]
id = 2
name = "colour1"
type = "img.constant"
pos = [0.0, 160.0]

[[node]]
id = 3
name = "diffusion1"
type = "ai.diffusion"
pos = [220.0, 160.0]
inputs.image = { node = 2, output = "out" }
params.effect = 0.0
params.model = "builtin.prompts"
params.policy = "hold"
params.route = "lan:a → lan:b"
