# Atidarla network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 5

[[node]]
id = 0
name = "flicker"
type = "sig.noise"
pos = [0.0, 0.0]
params.amplitude = 0.04
params.frequency = 8.0
params.offset = 1.0
params.seed = 7

[[node]]
id = 1
name = "expose"
type = "img.level"
pos = [220.0, 0.0]
params.brightness = { value = 1.0, bind = { node = 0, channel = "chan1" } }
params.contrast = 0.9

[[node]]
id = 2
name = "fade"
type = "img.hsv_adjust"
pos = [440.0, 0.0]
inputs.in = { node = 1, output = "out" }
params.saturation = 0.8

[[node]]
id = 3
name = "grain"
type = "img.noise"
pos = [440.0, 160.0]
params.amplitude = 0.12
params.octaves = 2
params.offset = 1.0
params.scale = 480.0
params.z = { value = 0.0, expr = "frame * 0.71" }

[[node]]
id = 4
name = "apply"
type = "img.composite"
pos = [660.0, 80.0]
inputs.a = { node = 3, output = "out" }
inputs.b = { node = 2, output = "out" }
params.operation = "multiply"
