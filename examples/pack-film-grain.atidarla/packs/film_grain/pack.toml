# Atidarla Pack. Its network is network.toml; its help page is help.md.
format = 1
name = "film_grain"
version = "1.0.0"
label = "Film Grain"
summary = "An old-film look: grain that changes every frame, a flicker in brightness, softened contrast and faded colour."
locked = true

[[param]]
name = "amount"
label = "Amount"
default = 0.12
min = 0.0
max = 1.0
help = "Strength of the grain: 0 is none, 0.3 is heavy."
to = [{ node = 3, param = "amplitude" }]

[[param]]
name = "grain_scale"
label = "Grain Scale"
default = 480.0
min = 20.0
max = 2000.0
help = "Grains across the image width: higher is finer, lower is coarse and blotchy."
to = [{ node = 3, param = "scale" }]

[[param]]
name = "monochrome"
label = "Monochrome"
default = true
help = "On: one grain for all colours, like black-and-white film. Off: separate grain per colour, like colour film."
to = [{ node = 3, param = "monochrome" }]

[[param]]
name = "flicker"
label = "Flicker"
default = 0.04
min = 0.0
max = 0.5
help = "How much the brightness wavers, like an old projector."
to = [{ node = 0, param = "amplitude" }]

[[param]]
name = "contrast"
label = "Contrast"
default = 0.9
min = 0.0
max = 2.0
help = "Below 1 lifts the blacks and dims the whites, like faded print stock."
to = [{ node = 1, param = "contrast" }]

[[param]]
name = "saturation"
label = "Saturation"
default = 0.8
min = 0.0
max = 2.0
help = "Colour intensity: 0 is black and white."
to = [{ node = 2, param = "saturation" }]

[[input]]
name = "in"
to = [{ node = 1, input = "in" }]

[[output]]
name = "out"
from = { node = 4, output = "out" }
