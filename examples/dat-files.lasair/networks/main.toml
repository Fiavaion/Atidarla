# Lasair network. Node IDs are stable: inputs and bindings refer to them.
format = 1
next_id = 5

[[node]]
id = 0
name = "cues"
type = "dat.file_in"
pos = [0.0, 0.0]
params.file = "data/cues.csv"

[[node]]
id = 1
name = "verses"
type = "dat.select"
pos = [220.0, 0.0]
inputs.in = { node = 0, output = "out" }
params.match = "verse"
params.match_col = "scene"

[[node]]
id = 2
name = "export"
type = "dat.file_out"
pos = [440.0, 0.0]
inputs.in = { node = 1, output = "out" }
params.file = "out/verses.tsv"
params.mode = "on_pulse"

[[node]]
id = 3
name = "show"
type = "dat.file_in"
pos = [0.0, 160.0]
params.file = "data/show.json"

[[node]]
id = 4
name = "acts"
type = "dat.json"
pos = [220.0, 160.0]
inputs.in = { node = 3, output = "out" }
params.path = "/acts"
