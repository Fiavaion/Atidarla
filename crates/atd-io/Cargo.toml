[package]
name = "atd-io"
description = "Atidarla: media and protocol I/O (OSC, MIDI, video, audio devices, DMX, timecode)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
atd-core.workspace = true
atd-format.workspace = true
serde_json.workspace = true
rosc.workspace = true
cpal.workspace = true
snap.workspace = true
png.workspace = true
zune-jpeg.workspace = true
midir.workspace = true
gilrs.workspace = true
thiserror.workspace = true
log.workspace = true

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[features]
