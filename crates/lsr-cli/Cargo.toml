[package]
name = "lsr-cli"
description = "Lasair headless entry points: lasair run|render|bake|serve|bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "lasair"
path = "src/main.rs"

[dependencies]
lsr-core.workspace = true
lsr-gpu.workspace = true
lsr-format.workspace = true
lsr-ai.workspace = true
lsr-io.workspace = true
rosc.workspace = true
lsr-agent.workspace = true
lsr-stage.workspace = true
lsr-timeline.workspace = true
lsr-py.workspace = true
lsr-ops-img.workspace = true
lsr-ops-sig.workspace = true
lsr-ops-pnt.workspace = true
lsr-ops-msh.workspace = true
lsr-ops-mat.workspace = true
lsr-ops-dat.workspace = true
lsr-ops-cmp.workspace = true
lsr-ops-ai.workspace = true
lsr-kernel.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
env_logger.workspace = true
log.workspace = true
wgpu.workspace = true
pollster.workspace = true
lsr-interop.workspace = true
png.workspace = true
# Show export (FR-S9): file hashes in the manifest, the optional zip.
sha2.workspace = true
zip.workspace = true
toml_edit = { workspace = true, features = ["serde"] }
# `run` supervisor: stop the child on Ctrl-C / SIGTERM.
ctrlc.workspace = true

# `storage uninstall --models ask`: the Yes/No message box.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_WindowsAndMessaging",
] }

# The exe's icon resource (build.rs, PRD A69).
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[dev-dependencies]
# The mock ComfyUI server shared with lsr-ops-ai's tests (render test).
tungstenite.workspace = true

[features]
# Non-HAP video through FFmpeg (PRD A23); needs FFmpeg development files.
ffmpeg = ["lsr-ops-img/ffmpeg"]

[lints]
workspace = true
