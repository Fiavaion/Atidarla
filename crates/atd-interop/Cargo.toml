[package]
name = "atd-interop"
description = "Atidarla per-OS GPU texture sharing via wgpu-hal (DX12 shared handles, IOSurface) with readback fallback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
wgpu.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi_Common",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", features = ["CFDictionary", "CFNumber", "CFString"] }
objc2-io-surface = { version = "0.3", features = ["IOSurfaceRef", "IOSurfaceTypes", "objc2-core-foundation"] }
objc2-metal = { version = "0.3", features = [
    "MTLDevice",
    "MTLTexture",
    "MTLResource",
    "MTLPixelFormat",
    "MTLAllocation",
    "objc2-io-surface",
] }

[dev-dependencies]
pollster.workspace = true

[lints]
workspace = true
