[package]
name = "atd-app"
description = "Atidarla application shell: Patch, Stage and Timeline views over one graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "atidarla-app"
path = "src/main.rs"

[dependencies]
atd-core.workspace = true
atd-gpu.workspace = true
atd-io.workspace = true
atd-interop.workspace = true
atd-ops-img.workspace = true
atd-ops-sig.workspace = true
atd-ops-pnt.workspace = true
atd-ops-msh.workspace = true
atd-ops-mat.workspace = true
atd-ops-dat.workspace = true
atd-ops-cmp.workspace = true
atd-ops-ai.workspace = true
atd-stage.workspace = true
egui.workspace = true
eframe = { workspace = true, features = ["wgpu", "default_fonts", "x11", "wayland"] }
wgpu.workspace = true
env_logger.workspace = true
log.workspace = true
serde_json.workspace = true
png.workspace = true
atd-format.workspace = true
atd-timeline.workspace = true
atd-py.workspace = true
rfd.workspace = true
pollster.workspace = true

[features]
# Non-HAP video through FFmpeg (PRD A23); needs FFmpeg development files.
ffmpeg = ["atd-ops-img/ffmpeg"]

[lints]
workspace = true
