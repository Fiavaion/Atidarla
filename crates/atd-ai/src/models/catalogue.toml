# Atidarla model catalogue (FR-A12, PRD A61). Embedded in atd-ai.
#
# Every entry pins a Hugging Face revision (commit hash) and lists each file
# with its size and SHA-256 (the LFS oid for weights; computed for small
# files fetched at that revision). Licences were checked on the model card
# and the Hugging Face API; the evidence is in docs/models.md. No weights are
# ever committed or bundled (CLAUDE.md rule 4): they are downloaded on demand
# into the per-user model cache after the user accepts the licence.
#
# licence.class: commercial-safe | restricted | non-commercial
# main: the file whose SHA-256 a project records in its [[models]] manifest.

format = 1

