name: CI

# PRD §9 M0: Windows and macOS (Apple Silicon) are required jobs; Linux is a
# non-blocking build (A18). cargo-deny enforces the licence policy (rule 3).

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  # Every pushed commit gets its own group (and a full result); superseded
  # pull-request runs are cancelled.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, optional: false, python: python, gpu: "1" }
          - { name: macos-arm64, os: macos-latest, optional: false, python: python3, gpu: "1" }
          - { name: linux, os: ubuntu-latest, optional: true, python: python3, gpu: "" }
    env:
      ATD_PYTHON: ${{ matrix.python }}
      # GPU tests must run, not skip, where the runner has a GPU device
      # (WARP on Windows, the paravirtual Metal device on macOS).
      ATD_REQUIRE_GPU: ${{ matrix.gpu }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux headers (ALSA for cpal, libudev for gilrs)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Operator docs are current
        run: cargo run -p atd-cli -- docs --check
      - name: Bench (start-up cases)
        run: cargo run -p atd-cli --release -- bench --out bench-${{ matrix.name }}.json
      - name: Show bench JSON
        shell: bash
        run: cat bench-${{ matrix.name }}.json
      - name: Example projects (M1 AC1, AC4; rule 7)
        # Every example loads, validates against the registry and is in
        # canonical form; where the runner has a GPU, every node cooks for a
        # second without errors and every binding finds its channel.
        shell: bash
        run: cargo run -p atd-cli --release -- check ${{ matrix.gpu == '1' && '--gpu' || '' }} examples/*.atidarla
      - name: ISF import (M1 AC2, FR-K6)
        # Translate, build and cook the public Vidvox ISF collection (MIT) at
        # a pinned commit on the runner's GPU; fail below 90%. Slow compiles
        # (FXC on WARP) are reported; one shader may take at most 60 s.
        if: matrix.gpu == '1'
        timeout-minutes: 45
        shell: bash
        run: |
          git clone -q https://github.com/Vidvox/ISF-Files.git isf-corpus
          git -C isf-corpus checkout -q 395072d48b3ce7351ccb20a5fda54470591324df
          cargo run -p atd-cli --release -- isf-import isf-corpus/ISF --report --gpu --min-pass 90 --json isf-${{ matrix.name }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.name }}
          path: |
            bench-${{ matrix.name }}.json
            isf-${{ matrix.name }}.json
          if-no-files-found: ignore

  ffmpeg:
    # PRD A23: video other than HAP plays through FFmpeg (LGPL, dynamic). The
    # feature is off by default, so this job builds and tests it on each OS.
    # Hardware decode (VideoToolbox, D3D11VA) shows in the test output when the
    # runner has it; the software path must pass everywhere.
    name: FFmpeg (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, optional: false, python: python, gpu: "1" }
          - { name: macos-arm64, os: macos-latest, optional: false, python: python3, gpu: "1" }
          - { name: linux, os: ubuntu-latest, optional: true, python: python3, gpu: "" }
    env:
      ATD_PYTHON: ${{ matrix.python }}
      ATD_REQUIRE_GPU: ${{ matrix.gpu }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ffmpeg
      - name: FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libavcodec-dev libavformat-dev libavutil-dev libswscale-dev pkg-config libasound2-dev libudev-dev
      - name: FFmpeg (macOS)
        # Homebrew's build is GPL: fine to test against, never shipped (A23).
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkgconf
      - name: FFmpeg (Windows, LGPL shared build)
        # The stable 9.0 branch of BtbN's builds (include/, lib/, bin/ with the
        # DLLs). The dated builds are pruned, so this one moves with 9.0.x.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -fsSL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-lgpl-shared-9.0.zip
          unzip -q ffmpeg.zip -d "$RUNNER_TEMP/ffmpeg"
          dir=$(cygpath -w "$(ls -d "$RUNNER_TEMP"/ffmpeg/*/)")
          echo "FFMPEG_DIR=$dir" >> "$GITHUB_ENV"
          echo "$dir\bin" >> "$GITHUB_PATH"
      - name: Clippy
        run: cargo clippy -p atd-io -p atd-ops-img --all-targets --features atd-io/ffmpeg -- -D warnings
      - name: Test
        run: cargo test -p atd-io -p atd-ops-img --features atd-io/ffmpeg
      - name: Decoder in use (software or hardware)
        run: cargo test -p atd-io --features ffmpeg --test ffmpeg -- --nocapture

  app-smoke:
    # M0 AC2: the shell starts, renders frames and screenshots on each OS.
    name: App smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, optional: false }
          - { name: macos-arm64, os: macos-latest, optional: false }
          - { name: linux, os: ubuntu-latest, optional: true }
    steps:
      - uses: actions/checkout@v4
      # The app embeds Python for expressions (PRD A22): it links libpython.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-smoke
      - name: Linux display and Vulkan driver
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libxkbcommon-x11-0 mesa-vulkan-drivers libasound2-dev libudev-dev
      - name: Build
        run: cargo build -p atd-app --release
      - name: Smoke run
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then RUN="xvfb-run -a -s '-screen 0 1440x900x24'"; else RUN=""; fi
          # Opens the AC1 example project, so the shell is shown with a real patch.
          eval $RUN ./target/release/atidarla-app examples/audio-reactive-feedback.atidarla --smoke 120 --screenshot shell-${{ matrix.name }}.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-${{ matrix.name }}
          path: shell-${{ matrix.name }}.png
          if-no-files-found: warn

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  ai-host:
    name: AI Host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: ai-host
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q
