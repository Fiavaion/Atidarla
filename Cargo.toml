[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fiavaion/atidarla"
authors = ["The Atidarla Contributors"]
publish = false

[workspace.dependencies]
# Internal crates
atd-core = { path = "crates/atd-core" }
atd-gpu = { path = "crates/atd-gpu" }
atd-kernel = { path = "crates/atd-kernel" }
atd-ai = { path = "crates/atd-ai" }
atd-agent = { path = "crates/atd-agent" }
atd-format = { path = "crates/atd-format" }
atd-io = { path = "crates/atd-io" }
atd-interop = { path = "crates/atd-interop" }
atd-py = { path = "crates/atd-py" }
atd-stage = { path = "crates/atd-stage" }
atd-timeline = { path = "crates/atd-timeline" }
atd-ops-img = { path = "crates/atd-ops-img" }
atd-ops-sig = { path = "crates/atd-ops-sig" }
atd-ops-pnt = { path = "crates/atd-ops-pnt" }
atd-ops-msh = { path = "crates/atd-ops-msh" }
atd-ops-mat = { path = "crates/atd-ops-mat" }
atd-ops-dat = { path = "crates/atd-ops-dat" }
atd-ops-cmp = { path = "crates/atd-ops-cmp" }
atd-ops-ai = { path = "crates/atd-ops-ai" }

# Pinned stack (PRD A5). wgpu is pinned to one major per release train.
wgpu = "=30.0.1"
naga = { version = "=30.0.1", features = ["glsl-in", "wgsl-in", "wgsl-out"] }
egui = "0.37"
eframe = { version = "0.37", default-features = false }
pyo3 = "0.30"

# General
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
memmap2 = "0.9"
hound = "3.5"
rustfft = "6.4"
rosc = "0.11"
cpal = "0.18"
snap = "1.1"
png = "0.18"
zune-jpeg = "0.4"
midir = "0.11"
mdns-sd = { version = "0.21", default-features = false, features = ["logging"] }
gilrs = "0.11"
ab_glyph_rasterizer = "0.1"
skrifa = "0.44"
epaint_default_fonts = "0.37"
toml_edit = "0.25"
rfd = "0.17"
sha2 = "0.10"
ctrlc = { version = "3", features = ["termination"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# Model downloads (FR-A12): rustls with the ring provider and the OS trust
# store (platform verifier), so no bundled root list and no native-tls.
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# ComfyUI client (atd-ai::comfy): plain HTTP and WebSocket to a local or LAN
# server through the egress gate. ureq 2 for its resolver hook (the gate
# pins the resolved address); to move to ureq 3 with the model downloads.
ureq2 = { package = "ureq", version = "2.12", default-features = false }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2
