[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fiavaion/lasair"
authors = ["The Lasair Contributors"]
publish = false

[workspace.dependencies]
# Internal crates
lsr-core = { path = "crates/lsr-core" }
lsr-gpu = { path = "crates/lsr-gpu" }
lsr-kernel = { path = "crates/lsr-kernel" }
lsr-ai = { path = "crates/lsr-ai" }
lsr-agent = { path = "crates/lsr-agent" }
lsr-format = { path = "crates/lsr-format" }
lsr-io = { path = "crates/lsr-io" }
lsr-interop = { path = "crates/lsr-interop" }
lsr-py = { path = "crates/lsr-py" }
lsr-stage = { path = "crates/lsr-stage" }
lsr-timeline = { path = "crates/lsr-timeline" }
lsr-ops-img = { path = "crates/lsr-ops-img" }
lsr-ops-sig = { path = "crates/lsr-ops-sig" }
lsr-ops-pnt = { path = "crates/lsr-ops-pnt" }
lsr-ops-msh = { path = "crates/lsr-ops-msh" }
lsr-ops-mat = { path = "crates/lsr-ops-mat" }
lsr-ops-dat = { path = "crates/lsr-ops-dat" }
lsr-ops-cmp = { path = "crates/lsr-ops-cmp" }
lsr-ops-ai = { path = "crates/lsr-ops-ai" }

# Pinned stack (PRD A5). wgpu is pinned to one major per release train.
wgpu = "=30.0.1"
naga = { version = "=30.0.1", features = ["glsl-in", "wgsl-in", "wgsl-out"] }
egui = "0.37"
eframe = { version = "0.37", default-features = false }
pyo3 = "0.30"

# General
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
memmap2 = "0.9"
hound = "3.5"
rustfft = "6.4"
rosc = "0.11"
cpal = "0.18"
snap = "1.1"
png = "0.18"
# VAT In reads OpenEXR textures (BSD-3-Clause). 1.73: 1.74 pulls in `paste`
# (RUSTSEC-2024-0436, unmaintained) through `pulp`.
exr = { version = "~1.73", default-features = false }
zune-jpeg = "0.4"
midir = "0.11"
mdns-sd = { version = "0.21", default-features = false, features = ["logging"] }
gilrs = "0.11"
ab_glyph_rasterizer = "0.1"
skrifa = "0.44"
epaint_default_fonts = "0.37"
toml_edit = "0.25"
rfd = "0.17"
sha2 = "0.10"
ctrlc = { version = "3", features = ["termination"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# Splat In (FR-C1): SPZ is gzip (v1-3) or zstd streams (v4); SOG is lossless
# WebP images. All pure Rust, MIT OR Apache-2.0 / MIT.
flate2 = "1"
ruzstd = "0.9"
image-webp = "0.2"
# Model downloads (FR-A12): rustls with the ring provider and the OS trust
# store (platform verifier), so no bundled root list and no native-tls.
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# WebSocket `wss://` (lsr-ops-dat): the same OS trust store as the downloads.
rustls-platform-verifier = "0.7"
# Tests only: certificates for local TLS servers (MIT OR Apache-2.0).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
time = "0.3"
# ComfyUI client (lsr-ai::comfy): plain HTTP and WebSocket to a local or LAN
# server through the egress gate. ureq 2 for its resolver hook (the gate
# pins the resolved address); to move to ureq 3 with the model downloads.
ureq2 = { package = "ureq", version = "2.12", default-features = false }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# Serial ports (lsr-ops-dat `dat.serial`): termios on Unix, the comm API on
# Windows.
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Devices_Communication"] }
# The Windows executables' icon resource (build.rs of lsr-app and lsr-cli;
# Windows hosts only).
winresource = { version = "0.1", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2
